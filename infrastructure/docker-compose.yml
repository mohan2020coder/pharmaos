services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharmaos
      POSTGRES_USER: pharmaos
      POSTGRES_PASSWORD: pharmaos
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmaos -d pharmaos"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: pharmaos_test
      POSTGRES_USER: pharmaos
      POSTGRES_PASSWORD: pharmaos
    ports:
      - "55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmaos -d pharmaos_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://pharmaos:pharmaos@postgres:5432/pharmaos?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-development-secret-change-in-production
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006,http://127.0.0.1:19006
      HTTP_ADDR: :8080
      MIGRATIONS_DIR: /app/migrations
      LOG_LEVEL: info
    ports:
      - "8080:8080"

  admin-web:
    build:
      context: ../admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      - api
    ports:
      - "8081:80"

  nginx:
    image: nginx:1.27-alpine
    profiles: ["edge"]
    depends_on:
      - api
      - admin-web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
