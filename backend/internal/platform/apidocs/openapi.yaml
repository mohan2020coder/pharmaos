openapi: 3.0.3
info:
  title: PharmaOS Enterprise SFA + Distribution Connect API
  version: 1.0.0-phase9
  description: |
    Phase 9 HTTP API for the multi-tenant PharmaOS platform. Business endpoints are
    served under `/api/v1` and require a bearer access token issued by the public
    authentication endpoints. Protected endpoints are also scoped to the token's
    tenant, active session, and role permissions. Health and documentation routes
    are public.
servers:
  - url: /
    description: Same host serving the PharmaOS backend
tags:
  - name: Health
    description: Liveness and readiness probes registered when a database is configured.
  - name: Documentation
    description: Built-in API documentation endpoints.
  - name: Observability
    description: Public Prometheus-formatted metrics endpoint for scrape collection.
  - name: Auth
    description: Authentication, session, and password management.
  - name: Tenants
    description: Tenant administration and settings.
  - name: Users
    description: User administration and role grants.
  - name: Roles
    description: Role administration and permission assignments.
  - name: Permissions
    description: Permission catalogue.
  - name: Organization
    description: Divisions, branches, regions, territories, and the organization hierarchy.
  - name: Employees
    description: Employee records, positions, effective-dated assignments, and transfers.
  - name: Master data
    description: Doctors, chemists, stockists, product categories, and products.
  - name: CRM targets
    description: Effective-period targets for doctors, chemists, and stockists.
  - name: Field execution
    description: Tour plans, GPS visits, attachments, and daily call reports.
  - name: Distribution
    description: Company-distributor links, orders, secondary sales, and serialized inventory movements.
  - name: Mobile sync
    description: Offline-first change pull, operation push, and queue status endpoints.
  - name: Reporting
    description: Scope-aware dashboards, immutable audit trail, saved definitions, and report snapshots.
  - name: Integrations
    description: Integration connections, webhook event publishing, delivery history, and retries.
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getHealthz
      description: Returns process liveness and uptime. Public endpoint.
      security: []
      responses:
        '200':
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                message: OK
                data:
                  status: alive
                  uptime_seconds: 123.45
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      operationId: getReadyz
      description: Checks database connectivity and that all expected migrations have been applied. Public endpoint.
      security: []
      responses:
        '200':
          description: Database is reachable and migrations are current.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                message: OK
                data:
                  status: ready
                  database: ok
                  migration_version: 12
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /docs:
    get:
      tags: [Documentation]
      summary: API documentation UI
      operationId: getDocsUI
      description: Returns a small HTML page linking to the OpenAPI document. Public endpoint.
      security: []
      responses:
        '200':
          description: HTML documentation page.
          content:
            text/html:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /docs/openapi.yaml:
    get:
      tags: [Documentation]
      summary: OpenAPI document
      operationId: getOpenAPIDocument
      description: Returns the embedded OpenAPI 3.0.3 specification. Public endpoint.
      security: []
      responses:
        '200':
          description: YAML OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /metrics:
    get:
      tags: [Observability]
      summary: Prometheus metrics
      operationId: getMetrics
      description: Returns Prometheus-formatted HTTP request and security-event counters. Public endpoint; restrict access at the edge.
      security: []
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in and issue tokens
      operationId: login
      description: Authenticates a user within a tenant and creates a new session. Public endpoint.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded; access and refresh tokens returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh an access token
      operationId: refreshToken
      description: Exchanges a valid refresh token for a new token pair and session. Public endpoint.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token pair refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset
      operationId: forgotPassword
      description: |
        If the account exists, a reset token is generated and dispatched through the
        configured password-reset sender. The response is always accepted for valid
        input. Public endpoint.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagResponse'
              example:
                success: true
                message: OK
                data:
                  accepted: true
                  message: If the account exists, reset instructions have been sent
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset a password with a reset token
      operationId: resetPassword
      description: Consumes a password-reset token, updates the password, and revokes active sessions. Public endpoint.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagResponse'
              example:
                success: true
                message: OK
                data:
                  password_reset: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out of the current session
      operationId: logout
      description: Revokes the access token's session. Requires a valid bearer token and active session.
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagResponse'
              example:
                success: true
                message: OK
                data:
                  logged_out: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get the current principal
      operationId: getCurrentPrincipal
      description: Returns identity, roles, permissions, and data scope from the authenticated access token.
      responses:
        '200':
          description: Current principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      summary: List active sessions
      operationId: listSessions
      description: Returns non-revoked, unexpired sessions for the authenticated user.
      responses:
        '200':
          description: Active sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the current user's password
      operationId: changePassword
      description: Verifies the current password and sets a new password for the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagResponse'
              example:
                success: true
                message: OK
                data:
                  password_changed: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/tenants:
    get:
      tags: [Tenants]
      summary: List tenants
      operationId: listTenants
      description: |
        Returns a paginated tenant list. Non-privileged callers receive only their own
        tenant. Requires the `tenant.view` permission.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Paginated tenants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Tenants]
      summary: Create a tenant
      operationId: createTenant
      description: Creates a tenant. Requires the `tenant.manage` permission and a privileged principal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/tenants/{id}:
    parameters:
      - $ref: '#/components/parameters/IDParam'
    get:
      tags: [Tenants]
      summary: Get a tenant
      operationId: getTenant
      description: Returns one tenant. Non-privileged callers may only read their own tenant. Requires the `tenant.view` permission.
      responses:
        '200':
          description: Tenant details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Tenants]
      summary: Update a tenant
      operationId: updateTenant
      description: Updates a tenant's name, status, timezone, currency, and settings. Requires the `tenant.manage` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: Tenant updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/tenants/{id}/settings/{key}:
    put:
      tags: [Tenants]
      summary: Set a tenant setting
      operationId: setTenantSetting
      description: Inserts or replaces a tenant setting identified by key. Requires the `tenant.manage` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
        - $ref: '#/components/parameters/SettingKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingValueRequest'
      responses:
        '200':
          description: Setting stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      operationId: listUsers
      description: Returns a paginated user list scoped by tenant unless the caller is privileged. Requires the `user.view` permission.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Paginated users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Users]
      summary: Create a user
      operationId: createUser
      description: |
        Creates a user in the caller's tenant, or in an explicitly supplied tenant when
        the caller is privileged. Requires the `user.manage` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/IDParam'
    get:
      tags: [Users]
      summary: Get a user
      operationId: getUser
      description: Returns one user. Cross-tenant access is rejected for non-privileged callers. Requires the `user.view` permission.
      responses:
        '200':
          description: User details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Users]
      summary: Update a user
      operationId: updateUser
      description: Updates name, phone, status, and email verification for a user. Requires the `user.manage` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users/{id}/deactivate:
    post:
      tags: [Users]
      summary: Deactivate a user
      operationId: deactivateUser
      description: Deactivates a user. A user cannot deactivate their own account. Requires the `user.manage` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
      responses:
        '200':
          description: User deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagResponse'
              example:
                success: true
                message: OK
                data:
                  deactivated: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users/{id}/roles:
    parameters:
      - $ref: '#/components/parameters/IDParam'
    get:
      tags: [Users]
      summary: List role grants for a user
      operationId: listUserRoles
      description: Returns active and expired role assignment records for a user. Requires the `user.view` permission.
      responses:
        '200':
          description: Role grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleGrantListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Users]
      summary: Assign a role to a user
      operationId: assignUserRole
      description: Creates a scoped role grant for a user. Requires the `user.manage` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '200':
          description: Role assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagResponse'
              example:
                success: true
                message: OK
                data:
                  assigned: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/users/{id}/roles/{role_id}:
    delete:
      tags: [Users]
      summary: Remove a role from a user
      operationId: removeUserRole
      description: Removes the matching user-role grant. Requires the `user.manage` permission.
      parameters:
        - $ref: '#/components/parameters/IDParam'
        - $ref: '#/components/parameters/RoleIDParam'
        - $ref: '#/components/parameters/ScopeTypeParam'
        - $ref: '#/components/parameters/ScopeIDParam'
      responses:
        '200':
          description: Role removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagResponse'
              example:
                success: true
                message: OK
                data:
                  removed: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/roles:
    get:
      tags: [Roles]
      summary: List roles
      operationId: listRoles
      description: Returns a paginated role list. Requires the `role.view` permission.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          description: Paginated roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Roles]
      summary: Create a role
      operationId: createRole
      description: Creates a tenant role with an optional set of permission codes. Requires the `role.manage` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
