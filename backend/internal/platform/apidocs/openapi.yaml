        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Delivery requeued., content: {application/json: {schema: {$ref: '#/components/schemas/SuccessEnvelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/sync/changes:
    get:
      tags: [Mobile sync]
      summary: Pull scoped server changes
      operationId: listSyncChanges
      description: |
        Returns changes for the authenticated principal's tenant and data scope.
        The cursor is opaque and must be passed back unchanged. Use `entities` to
        limit the pull to a comma-separated subset of supported read models.
      parameters:
        - name: since
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: entities
          in: query
          description: Comma-separated entity names such as `doctor,product,visit,order,inventory`.
          schema: {type: string}
      responses:
        '200': {description: Paginated changes., content: {application/json: {schema: {$ref: '#/components/schemas/SuccessEnvelope'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/sync/operations:
    post:
      tags: [Mobile sync]
      summary: Push a batch of offline operations
      operationId: pushSyncOperations
      description: |
        Applies a batch of device operations and returns one result per operation.
        Each result status is `APPLIED`, `REPLAYED`, `CONFLICT`, or `REJECTED`.
        Successful operations are stored by client operation ID for replay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [id, entity, entity_id, operation, payload, idempotency_key]
                    properties:
                      id: {type: string, format: uuid}
                      entity: {type: string}
                      entity_id: {type: string, format: uuid}
                      operation: {type: string, enum: [visit.create, visit.submit, visit.attachment, dcr.create, dcr.product.add, dcr.submit, dcr.approve, dcr.reject, tour.create, tour.line.add, tour.submit, tour.approve, tour.reject, order.create, order.submit, order.approve, secondary_sale.create, inventory.movement]}
                      payload: {type: object, additionalProperties: true}
                      idempotency_key: {type: string, format: uuid}
      responses:
        '200': {description: Operation results., content: {application/json: {schema: {$ref: '#/components/schemas/SuccessEnvelope'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/sync/status:
    get:
      tags: [Mobile sync]
      summary: Get sync status
      operationId: getSyncStatus
      description: Returns server time for clock-skew correction, the latest cursor, queue hints, and supported entities.
      responses:
        '200': {description: Sync status., content: {application/json: {schema: {$ref: '#/components/schemas/SuccessEnvelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by `POST /api/v1/auth/login` or `POST /api/v1/auth/refresh`.
  parameters:
    IDParam:
      name: id
      in: path
      required: true
      description: UUID of the resource.
      schema:
        type: string
        format: uuid
    RoleIDParam:
      name: role_id
      in: path
      required: true
      description: UUID of the role grant to remove.
      schema:
        type: string
        format: uuid
    SettingKeyParam:
      name: key
      in: path
      required: true
      description: Tenant setting key.
      schema:
        type: string
        minLength: 1
    ScopeTypeParam:
      name: scope_type
      in: query
      required: false
      description: Scope type of the role grant to remove. Defaults to `TENANT`.
      schema:
        type: string
        default: TENANT
    ScopeIDParam:
      name: scope_id
      in: query
      required: false
      description: Optional scope UUID of the role grant to remove.
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      description: One-based page number; invalid values fall back to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      required: false
      description: Page size; values greater than 200 or below 1 fall back to 20.
      schema:
        type: integer
        default: 20
    SortParam:
      name: sort
      in: query
      required: false
      description: Sort field; unsupported values fall back to `created_at`.
      schema:
        type: string
        enum: [created_at, updated_at, name, email, code, status]
        default: created_at
    OrderParam:
      name: order
      in: query
      required: false
      description: Sort direction; invalid values fall back to `desc`.
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    SearchParam:
      name: search
      in: query
      required: false
      description: Optional search term; support depends on the resource repository.
      schema:
        type: string
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID used to deduplicate non-idempotent writes.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Malformed JSON, invalid path parameter, or otherwise invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing, invalid, or expired authentication, or an expired/revoked session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Caller lacks the required permission or resource access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found or inaccessible for the caller's tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Resource already exists or cannot be modified in its current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Request passed JSON decoding but failed field validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Client exceeded the configured per-IP rate limit.
      headers:
        Retry-After:
          description: Seconds until the client may retry.
          schema:
            type: integer
            example: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Database unavailable, migration state unavailable, or migrations pending.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    FieldActivityReport:
      type: object
      properties:
        period: {type: object, properties: {from: {type: string, format: date}, to: {type: string, format: date}}}
        scope: {type: string, example: TERRITORY}
        visits:
          type: object
          properties:
            total: {type: integer}
            submitted: {type: integer}
            draft: {type: integer}
            unique_customers: {type: integer}
        daily_call_reports:
          type: object
          properties:
            total: {type: integer}
            submitted: {type: integer}
            approved: {type: integer}
    DistributionSummaryReport:
      type: object
      properties:
        period: {type: object, properties: {from: {type: string, format: date}, to: {type: string, format: date}}}
        orders:
          type: object
          properties:
            total: {type: integer}
            submitted: {type: integer}
            approved: {type: integer}
            cancelled: {type: integer}
            value: {type: number, format: double}
        inventory:
          type: object
          properties:
            sku_count: {type: integer}
            on_hand: {type: integer}
            reserved: {type: integer}
        secondary_sales:
          type: object
          properties:
            records: {type: integer}
            units: {type: integer}
            value: {type: number, format: double}
        active_links: {type: integer}
    ReportDefinitionRequest:
      type: object
      required: [code, name, report_type]
      properties:
        code: {type: string, maxLength: 80}
        name: {type: string, maxLength: 160}
        description: {type: string}
        report_type: {type: string, enum: [FIELD_ACTIVITY, DISTRIBUTION_SUMMARY, AUDIT_TRAIL]}
        config: {type: object, additionalProperties: true}
    ReportDefinition:
      allOf:
        - {$ref: '#/components/schemas/ReportDefinitionRequest'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            tenant_id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    SnapshotRequest:
      type: object
      required: [report_type, payload]
      properties:
        definition_id: {type: string, format: uuid}
        report_type: {type: string, enum: [FIELD_ACTIVITY, DISTRIBUTION_SUMMARY, AUDIT_TRAIL]}
        from: {type: string, format: date}
        to: {type: string, format: date}
        payload: {type: object, additionalProperties: true}
    ReportSnapshot:
      allOf:
        - {$ref: '#/components/schemas/SnapshotRequest'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            tenant_id: {type: string, format: uuid}
            period_from: {type: string, format: date}
            period_to: {type: string, format: date}
            created_at: {type: string, format: date-time}
    ConnectionCreateRequest:
      type: object
      required: [name, kind]
      properties:
        name: {type: string, maxLength: 120}
        kind: {type: string, enum: [WEBHOOK, ERP, ANALYTICS]}
        endpoint_url: {type: string, format: uri}
        secret_ref: {type: string, maxLength: 160, description: Environment variable name containing the webhook signing secret.}
        headers: {type: object, additionalProperties: {type: string}}
    ConnectionStatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ACTIVE, DISABLED]}
    IntegrationConnection:
      allOf:
        - {$ref: '#/components/schemas/ConnectionCreateRequest'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            tenant_id: {type: string, format: uuid}
            status: {type: string, enum: [ACTIVE, DISABLED]}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    EventRequest:
      type: object
      required: [event_type, event_id, payload]
      properties:
        event_type: {type: string, maxLength: 120}
        event_id: {type: string, maxLength: 200}
        payload: {type: object, additionalProperties: true}
    WebhookDelivery:
      type: object
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        connection_id: {type: string, format: uuid}
        event_type: {type: string}
        event_id: {type: string}
        payload: {type: object, additionalProperties: true}
        status: {type: string, enum: [PENDING, IN_FLIGHT, DELIVERED, FAILED, DEAD]}
        attempts: {type: integer}
        next_attempt_at: {type: string, format: date-time}
        last_error: {type: string}
        response_status: {type: integer}
        delivered_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SuccessEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          description: Endpoint-specific payload; omitted when there is no data.
          nullable: true
        meta:
          $ref: '#/components/schemas/PageMeta'
        errors:
          description: Not present on successful responses.
    ErrorEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
        errors:
          description: Optional validation errors or operation details.
          nullable: true
    PageMeta:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 20
        total:
          type: integer
          format: int64
          example: 0
        total_pages:
          type: integer
          example: 0
    LoginRequest:
      type: object
      required: [tenant_code, email, password]
      properties:
        tenant_code:
          type: string
          minLength: 2
          maxLength: 40
          example: ACME
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 6
        device_id:
          type: string
          description: Optional device identifier stored with the session.
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
      properties:
        access_token:
          type: string
          description: JWT access token used with bearer authentication.
        refresh_token:
          type: string
          format: password
          description: JWT refresh token used with the refresh endpoint.
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
        refresh_expires_in:
          type: integer
          description: Refresh token lifetime in seconds.
    User:
      type: object
      required: [id, tenant_id, email, first_name, last_name, status, email_verified, must_change_password, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        email_verified:
          type: boolean
        must_change_password:
          type: boolean
        locked_until:
          type: string
          format: date-time
          nullable: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Role:
      type: object
      required: [id, code, name, description, is_system, is_privileged, data_scope, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
          nullable: true
          description: Null for platform-wide roles.
        code:
          type: string
        name:
          type: string
        description:
          type: string
        is_system:
          type: boolean
        is_privileged:
          type: boolean
        data_scope:
          type: string
          enum: [SELF, TEAM, TERRITORY, REGION, DIVISION, TENANT]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RoleWithPermissions:
      allOf:
        - $ref: '#/components/schemas/Role'
        - type: object
          required: [permissions]
          properties:
            permissions:
              type: array
              items:
                type: string
    Tenant:
      type: object
      required: [id, code, name, tenant_type, status, is_platform, timezone, currency_code, settings, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        tenant_type:
          type: string
          example: PHARMA_COMPANY
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, INACTIVE]
        is_platform:
          type: boolean
        country_code:
          type: string
          minLength: 2
          maxLength: 2
          nullable: true
        timezone:
          type: string
          example: UTC
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
          example: USD
        settings:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Permission:
      type: object
      required: [id, code, module, description, created_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        module:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
    LoginPrincipal:
      type: object
      required: [id, tenant_id, email, roles, permissions, data_scope]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        data_scope:
          type: string
          enum: [SELF, TEAM, TERRITORY, REGION, DIVISION, TENANT]
    RefreshPrincipal:
      type: object
      required: [id, tenant_id, roles]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
    Principal:
      type: object
      required: [id, tenant_id, email, roles, permissions, data_scope, is_privileged, division_ids, territory_ids]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        data_scope:
          type: string
          enum: [SELF, TEAM, TERRITORY, REGION, DIVISION, TENANT]
        is_privileged:
          type: boolean
        division_ids:
          type: array
          items:
            type: string
            format: uuid
        territory_ids:
          type: array
          items:
            type: string
            format: uuid
    Session:
      type: object
      required: [ID, UserID, TenantID, FamilyID, RefreshTokenHash, ExpiresAt, CreatedAt]
      description: Session record as exposed by the sessions endpoint.
      properties:
        ID:
          type: string
          format: uuid
        UserID:
          type: string
          format: uuid
        TenantID:
          type: string
          format: uuid
        FamilyID:
          type: string
          format: uuid
        RefreshTokenHash:
          type: string
          description: Hash of the refresh token bound to this session.
        IPAddress:
          type: string
          nullable: true
        UserAgent:
          type: string
          nullable: true
        DeviceID:
          type: string
          nullable: true
        ExpiresAt:
          type: string
          format: date-time
        RevokedAt:
          type: string
          format: date-time
          nullable: true
        CreatedAt:
          type: string
          format: date-time
    UserRoleGrant:
      type: object
      required: [user_id, role_id, scope_type, valid_from]
      properties:
        user_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
        scope_type:
          type: string
        scope_id:
          type: string
          format: uuid
          nullable: true
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
          nullable: true
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          format: password
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 10
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 10
    CreateTenantRequest:
      type: object
      required: [code, name, tenant_type]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 40
        name:
          type: string
          minLength: 2
          maxLength: 180
        tenant_type:
          type: string
          enum: [PHARMA_COMPANY, DISTRIBUTOR]
        country_code:
          type: string
          minLength: 2
          maxLength: 2
          nullable: true
        timezone:
          type: string
          maxLength: 80
          description: Defaults to UTC.
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
          description: Defaults to USD.
        settings:
          type: object
          additionalProperties: true
    UpdateTenantRequest:
      type: object
      required: [name, status, timezone, currency_code]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 180
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, INACTIVE]
        timezone:
          type: string
          maxLength: 80
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
        settings:
          type: object
          additionalProperties: true
    SettingValueRequest:
      type: object
      additionalProperties: true
      description: Arbitrary JSON object stored as the setting value.
    CreateUserRequest:
      type: object
      required: [email, password, first_name, last_name]
      properties:
        tenant_id:
          type: string
          format: uuid
          description: Optional for privileged callers; otherwise the caller's tenant is used.
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 10
        first_name:
          type: string
          minLength: 2
          maxLength: 80
        last_name:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          type: string
        must_change_password:
          type: boolean
    UpdateUserRequest:
      type: object
      required: [first_name, last_name, status]
      properties:
        first_name:
          type: string
          minLength: 2
          maxLength: 80
        last_name:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        email_verified:
          type: boolean
    AssignRoleRequest:
      type: object
      required: [role_id, scope_type]
      properties:
        role_id:
          type: string
          format: uuid
        scope_type:
          type: string
          enum: [SELF, TERRITORY, REGION, DIVISION, TENANT, PARTNER]
        scope_id:
          type: string
          format: uuid
          nullable: true
        valid_from:
          type: string
          format: date
          description: Optional ISO date (YYYY-MM-DD); defaults to the current date.
        valid_to:
          type: string
          format: date
          nullable: true
          description: Optional ISO date (YYYY-MM-DD).
    CreateRoleRequest:
      type: object
      required: [code, name, data_scope]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 40
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
        data_scope:
          type: string
          enum: [SELF, TEAM, TERRITORY, REGION, DIVISION, TENANT]
        is_privileged:
          type: boolean
        permissions:
          type: array
          items:
            type: string
    UpdateRoleRequest:
      type: object
      required: [name, data_scope]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
        data_scope:
